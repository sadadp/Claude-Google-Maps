<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ p.nombre }}</title>
<meta name="description" content="{{ p.nombre }}. {{ p.servicios|join(', ') }}. Citas por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family={{ fq.display }}&family={{ fq.sans }}&display=swap" rel="stylesheet">
<style>
:root{--bg:{{ m.bg }};--ink:{{ m.ink }};--acc:{{ m.acc }};--on:{{ m.on or m.bg }};--d:'{{ m.display }}',Georgia,serif;--s:'{{ m.sans }}',system-ui,sans-serif;
--line:color-mix(in srgb,var(--ink) 14%,transparent);--mute:color-mix(in srgb,var(--ink) 60%,transparent)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--s);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{width:calc(100% - 44px);max-width:1088px;margin-left:auto;margin-right:auto}
@media(min-width:768px){.wrap{width:calc(100% - 112px)}}
.lab{font:500 11px/1.2 var(--s);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--acc);color:var(--on);text-decoration:none;font:600 15px/1 var(--s);padding:17px 24px;transition:opacity .2s}
.btn:hover{opacity:.88}.btn svg{width:18px;height:18px;flex:none}
.lnk{font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.lnk:hover{color:var(--acc)}
.svc{list-style:none;counter-reset:s}
.svc li{display:flex;gap:22px;align-items:baseline;padding:22px 0;border-top:1px solid var(--line)}
.svc li:last-child{border-bottom:1px solid var(--line)}
.svc li i{flex:1;align-self:center;border-bottom:1px dotted color-mix(in srgb,var(--ink) 40%,transparent);min-width:24px}
.svc li b{font-weight:500;font-variant-numeric:tabular-nums}
.svc li::before{counter-increment:s;content:counter(s,decimal-leading-zero);font:500 12px var(--s);color:var(--acc);min-width:22px}
.hours{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hours td{padding:15px 0;border-top:1px solid var(--line);vertical-align:top}
.hours tr:last-child td{border-bottom:1px solid var(--line)}
.hours td+td{text-align:right}
.foot{padding:40px 0 120px;font-size:13px;color:var(--mute)}
@media(min-width:768px){.foot{padding-bottom:48px}}
.bar{position:fixed;left:14px;right:14px;bottom:14px;z-index:9;box-shadow:0 10px 30px -12px rgba(0,0,0,.45)}
.bar .btn{width:100%}
@media(min-width:768px){.bar{display:none}}
{% block css %}{% endblock %}
</style>
</head>
<body>
{% block body %}{% endblock %}
<div class="bar"><a class="btn" href="{{ wa }}">{% include 'wa.svg' %}{{ g.btn }}</a></div>
</body>
</html>
